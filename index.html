    font-size: 18px;
    cursor: pointer;
    border-radius: 10px;
    border: none;

    margin-top: 25px;
    font-size: 24px;
    font-weight: bold;

// Elegir pregunta al azar

const bancoPreguntas =
categoria === "ciencia" ? preguntasCiencia :
categoria === "cultura" ? preguntasCultura :
categoria === "geografia" ? preguntasGeografia :
categoria === "cine" ? preguntasCine :
categoria === "historia" ? preguntasHistoria :
categoria === "arte" ? preguntasArte :
preguntasMusica;

const preguntaElegida =
bancoPreguntas[Math.floor(Math.random() * bancoPreguntas.length)];


// Mostrar pregunta

document.getElementById("pregunta").textContent =
preguntaElegida.pregunta;


// Mezclar respuestas

const respuestas = [...preguntaElegida.respuestas];

respuestas.sort(() => Math.random() - 0.5);


// Crear botones

const contenedor =
document.getElementById("respuestas");

respuestas.forEach(respuesta => {

const boton = document.createElement("button");

boton.textContent = respuesta;

boton.onclick = () => responder(respuesta);

contenedor.appendChild(boton);

});


// Comprobar respuesta

function responder(respuesta) {

const resultado =
document.getElementById("resultado");

if (respuesta === preguntaElegida.correcta) {

resultado.textContent = "✅ ¡CORRECTO!";

} else {

resultado.textContent = "❌ INCORRECTO";

}

}

</script>
